repos:
  # --- Baseline file hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-ast
      - id: check-merge-conflict
      - id: debug-statements

  # --- Ruff: lint + format (replaces flake8, isort, pycodestyle, pyupgrade) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # --- Vulture: dead code detection ---
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.15
    hooks:
      - id: vulture

  # --- Bandit: security linting ---
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        exclude: ^01_pure_python/

  # --- Codespell: typo detection ---
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies: ['tomli']

  # --- ty: Astral's type checker (no official hook yet, use local) ---
  - repo: local
    hooks:
      - id: ty
        name: ty (type check)
        entry: uvx ty check
        language: system
        types: [python]
        pass_filenames: false

  # --- walk-the-code: tutorial annotations are keyed by line number, so any
  # --- edit to a lab can silently detach every annotation below it
  - repo: local
    hooks:
      - id: wtc-validate
        name: wtc-validate (tutorial annotations)
        entry: uvx --from "walk-the-code @ git+https://github.com/danilop/walk-the-code" wtc-validate walk-the-code/config.json --strict
        language: system
        pass_filenames: false
        files: ^(labs/|walk-the-code/)
      - id: wtc-annotation-coverage
        name: annotation coverage and duplicates
        entry: python3 walk-the-code/check_annotations.py
        language: system
        pass_filenames: false
        files: ^(labs/|walk-the-code/)
